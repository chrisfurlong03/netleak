# Build the Sphinx report and publish it to GitHub Pages.
# The report is generated from committed results/, so this needs no datasets and no secrets.
name: Report

on:
  push:
    branches: [main]
    paths:
      - "report/**"
      - "results/**"
      - "notebooks/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/report.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[report]"
      - name: Generate tables and figures from results/
        run: python report/make_tables.py
      - name: Build site
        run: |
          sphinx-build -b html -d report/_build/doctrees report report/_build/html
          touch report/_build/html/.nojekyll
      # Requires Pages to be enabled once: Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: report/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
